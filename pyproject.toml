[project]
name = "sumor"
version = "0.1.0"
description = "Sumerian morphology grammar (HFST): generation and analysis of Sumerian word forms"
readme = "README.md"
authors = [
    { name = "Christian Chiarcos" },
    { name = "Mohammad Sameer", email = "msameer@noreply.codeberg.org" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"

dependencies = [
    "hfst>=3.16.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
sumor = "sumor.analyze:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
